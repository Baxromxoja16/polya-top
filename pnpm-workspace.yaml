packages:
  - apps/*
  - packages/*

# Install paytida skript ishga tushirishga ruxsat berilgan paketlar (supply-chain himoyasi)
allowBuilds:
  "@swc/core": true
  cpu-features: false
  msgpackr-extract: false
  pnpm: true
  protobufjs: false
  ssh2: false

# Bitta joyda boshqariladigan versiyalar (paketlarda "catalog:" deb yoziladi)
catalog:
  "@types/node": 26.6.6
  typescript: 6.0.3
  vitest: 5.1.0
  zod: 4.6.7
